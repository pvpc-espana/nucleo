[project]
name = "pvpc"
version = "0.1.0"
description = "Obtención y publicación del PVPC (precio de la luz en España)"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
