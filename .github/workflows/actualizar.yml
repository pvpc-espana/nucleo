name: Actualizar precios

on:
  schedule:
    # Hora peninsular 07:00, 20:10, 21:00 y 23:30. GitHub sólo admite UTC, así que se
    # declaran las versiones de invierno (CET) y verano (CEST); el paso «Comprobar
    # horario» descarta las que no corresponden a la estación vigente.
    - cron: "0 6 * * *" # invierno 07:00
    - cron: "10 19 * * *" # invierno 20:10
    - cron: "0 20 * * *" # invierno 21:00
    - cron: "30 22 * * *" # invierno 23:30
    - cron: "0 5 * * *" # verano 07:00
    - cron: "10 18 * * *" # verano 20:10
    - cron: "0 19 * * *" # verano 21:00
    - cron: "30 21 * * *" # verano 23:30
  workflow_dispatch:
    inputs:
      fecha:
        description: "Día concreto (AAAA-MM-DD); vacío = hoy y mañana"
        required: false
      desde:
        description: "Inicio de un rango (AAAA-MM-DD) para recargas históricas"
        required: false
      hasta:
        description: "Fin del rango (AAAA-MM-DD); vacío = hoy"
        required: false

permissions:
  contents: read
  actions: write # reactivar este workflow para que GitHub no lo desactive por inactividad

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Comprobar horario
        id: horario
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          if [ -z "$CRON" ]; then echo "ejecutar=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          desfase=$(TZ=Europe/Madrid date +%z)
          case "$desfase:$CRON" in
            "+0100:0 6 * * *"|"+0100:10 19 * * *"|"+0100:0 20 * * *"|"+0100:30 22 * * *"| \
            "+0200:0 5 * * *"|"+0200:10 18 * * *"|"+0200:0 19 * * *"|"+0200:30 21 * * *")
              echo "ejecutar=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Cron «$CRON» no corresponde al horario vigente ($desfase); nada que hacer."
              echo "ejecutar=false" >> "$GITHUB_OUTPUT" ;;
          esac
          # La última ejecución del día exige que ya estén los precios de mañana
          case "$CRON" in "30 22 * * *"|"30 21 * * *") echo "exigir=--exigir-manana" >> "$GITHUB_OUTPUT" ;; esac

      - if: steps.horario.outputs.ejecutar == 'true'
        uses: actions/checkout@v5

      - if: steps.horario.outputs.ejecutar == 'true'
        uses: actions/checkout@v5
        with:
          repository: pvpc-espana/datos
          ssh-key: ${{ secrets.DATOS_DEPLOY_KEY }}
          path: datos

      - if: steps.horario.outputs.ejecutar == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Obtener y publicar precios
        if: steps.horario.outputs.ejecutar == 'true'
        env:
          TESTIGO: ${{ secrets.TESTIGO }}
          FECHA: ${{ inputs.fecha }}
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
          EXIGIR: ${{ steps.horario.outputs.exigir }}
        run: |
          argumentos=(--salida datos/docs)
          [ -n "$FECHA" ] && argumentos+=(--fecha "$FECHA")
          [ -n "$DESDE" ] && argumentos+=(--desde "$DESDE")
          [ -n "$HASTA" ] && argumentos+=(--hasta "$HASTA")
          [ -n "$EXIGIR" ] && argumentos+=("$EXIGIR")
          estado=0
          python -m pvpc "${argumentos[@]}" || estado=$?

          cd datos
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A docs
            dias=$(git diff --cached --name-only -- 'docs/v1/*/*/*.json' | xargs -rn1 basename | sed 's/\.json$//' | paste -sd ' ')
            git commit -q -m "PVPC ${dias:-índice}"
            git push -q
            echo "Publicado: ${dias:-índice}"
          else
            echo "Sin cambios que publicar."
          fi
          exit $estado

      - name: Mantener activo el workflow
        if: steps.horario.outputs.ejecutar == 'true' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/actualizar.yml/enable"
