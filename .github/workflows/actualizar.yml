name: Actualizar precios

on:
  schedule:
    # GitHub retrasa (a veces horas) o descarta ejecuciones programadas, así que no se
    # confía en una hora exacta: se lanza cada 20 minutos en las franjas útiles (UTC) y el
    # paso «Decidir» comprueba en hora peninsular si falta algo por publicar.
    - cron: "7,27,47 18-22 * * *" # tarde-noche: 19:07-23:47 (invierno) / 20:07-00:47 (verano)
    - cron: "17 4-8 * * *" # mañana: comprobar que está el día en curso
  workflow_dispatch:
    inputs:
      fecha:
        description: "Día concreto (AAAA-MM-DD); vacío = hoy y mañana"
        required: false
      desde:
        description: "Inicio de un rango (AAAA-MM-DD) para recargas históricas"
        required: false
      hasta:
        description: "Fin del rango (AAAA-MM-DD); vacío = hoy"
        required: false
      simular:
        description: "Generar y mostrar los JSON en el registro sin publicarlos en datos"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # reactivar este workflow para que GitHub no lo desactive por inactividad

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Decidir
        id: horario
        if: github.event_name == 'schedule'
        run: |
          # Todo en hora peninsular y según lo que ya está publicado, no según el cron
          hora=$(TZ=Europe/Madrid date +%H%M)
          hoy=$(TZ=Europe/Madrid date +%F)
          manana=$(TZ=Europe/Madrid date -d "$hoy 12:00 +1 day" +%F)
          publicado() {
            curl -sfI -o /dev/null "https://datos.pvpc.linaresdigital.com/v1/${1:0:4}/${1:5:2}/$1.json"
          }
          if ! publicado "$hoy"; then
            echo "Falta el día en curso ($hoy)."
            echo "exigir=--exigir-hoy" >> "$GITHUB_OUTPUT"
          elif [ "$hora" -ge 2000 ] && ! publicado "$manana"; then
            echo "Son las $hora y falta mañana ($manana)."
            # Último intento razonable de la noche: avisar (correo de fallo) si sigue sin estar
            if [ "$hora" -ge 2340 ]; then echo "exigir=--exigir-manana" >> "$GITHUB_OUTPUT"; fi
          else
            echo "Son las $hora: hoy ya está publicado y mañana no toca o ya está; nada que hacer."
            echo "ejecutar=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comprobar secretos
        if: steps.horario.outputs.ejecutar != 'false'
        env:
          CLAVE: ${{ secrets.DATOS_DEPLOY_KEY }}
          TESTIGO: ${{ secrets.TESTIGO }}
        run: |
          if [ -z "$CLAVE" ] && [ "${{ inputs.simular }}" != "true" ]; then
            echo "::error::Falta el secreto DATOS_DEPLOY_KEY (clave privada de despliegue con escritura en datos)"
            exit 1
          fi
          [ -n "$TESTIGO" ] || echo "::warning::Falta el secreto TESTIGO: se usará sólo apidatos.ree.es"

      - if: steps.horario.outputs.ejecutar != 'false'
        uses: actions/checkout@v5

      - if: steps.horario.outputs.ejecutar != 'false'
        uses: actions/checkout@v5
        with:
          repository: pvpc-espana/datos
          ssh-key: ${{ inputs.simular != true && secrets.DATOS_DEPLOY_KEY || '' }}
          path: datos

      - if: steps.horario.outputs.ejecutar != 'false'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Obtener y publicar precios
        if: steps.horario.outputs.ejecutar != 'false'
        env:
          TESTIGO: ${{ secrets.TESTIGO }}
          FECHA: ${{ inputs.fecha }}
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
          EXIGIR: ${{ steps.horario.outputs.exigir }}
          SIMULAR: ${{ inputs.simular }}
        run: |
          argumentos=(--salida datos/docs)
          [ -n "$FECHA" ] && argumentos+=(--fecha "$FECHA")
          [ -n "$DESDE" ] && argumentos+=(--desde "$DESDE")
          [ -n "$HASTA" ] && argumentos+=(--hasta "$HASTA")
          [ -n "$EXIGIR" ] && argumentos+=("$EXIGIR")
          estado=0
          python -m pvpc "${argumentos[@]}" || estado=$?

          cd datos
          if [ "$SIMULAR" = "true" ]; then
            git add -A docs
            for fichero in $(git diff --cached --name-only); do
              echo "::group::$fichero"; cat "$fichero"; echo "::endgroup::"
            done
            echo "Simulación: no se publica nada."
          elif [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A docs
            dias=$(git diff --cached --name-only -- 'docs/v1/*/*/*.json' | xargs -rn1 basename | sed 's/\.json$//' | paste -sd ' ')
            git commit -q -m "PVPC ${dias:-índice}"
            git push -q
            echo "Publicado: ${dias:-índice}"
          else
            echo "Sin cambios que publicar."
          fi
          exit $estado

      - name: Mantener activo el workflow
        if: steps.horario.outputs.ejecutar != 'false' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/actualizar.yml/enable"
